<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16161A">
<title>Bside</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{
  --font:'Wanted Sans Variable','Wanted Sans','Pretendard Variable',-apple-system,system-ui,sans-serif;
  --bg:#16161A; --surface:#202027; --surface-hi:#2A2A33;
  --border:#32323C; --border-strong:#43434F;
  --text:#F5F5F7; --text-dim:#8E8E9A; --text-faint:#5C5C68;
  --looking:#F5B942; --sharing:#4ADE80; --first:#A78BFA; --open:#60A5FA;
  --danger:#F87171; --on-color:#16161A;
  --r-card:14px; --r-ctrl:12px; --r-pill:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:14px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
input,textarea{font-family:inherit;letter-spacing:inherit}

#app{max-width:420px;margin:0 auto;min-height:100dvh}
.screen{display:none;flex-direction:column;min-height:100dvh;padding:0 16px}
.screen#s5{height:100dvh;min-height:0}
.screen.on{display:flex}

/* ── type: 4 sizes only ── */
.t-xl{font-size:19px;font-weight:600;line-height:1.3}
.t-lg{font-size:14px;font-weight:500;line-height:1.4}
.t-md{font-size:14px;font-weight:400;line-height:1.5}
.t-sm{font-size:12px;font-weight:400;line-height:1.4}
.t-num{font-size:22px;font-weight:600;line-height:1.2}
.dim{color:var(--text-dim)} .faint{color:var(--text-faint)}

/* ── controls ── */
.field{width:100%;height:48px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-ctrl);color:var(--text);font-size:14px;padding:0 14px;outline:none;
  transition:border-color .15s ease-out}
.field:focus{border-color:var(--border-strong)}
.field::placeholder{color:var(--text-faint)}
textarea.field{height:88px;padding:12px 14px;resize:none;line-height:1.5}
.btn{width:100%;height:48px;border-radius:var(--r-ctrl);background:var(--text);color:var(--bg);
  font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .15s ease-out}
.btn:active{opacity:.75}
.btn[disabled]{background:var(--surface-hi);color:var(--text-faint)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text)}
.err{color:var(--danger);font-size:12px;margin-top:6px;min-height:16px}

/* ── status colors ── */
.s-LOOKING_FOR{--c:var(--looking)} .s-CAN_SHARE{--c:var(--sharing)}
.s-FIRST_TIME{--c:var(--first)} .s-OPEN{--c:var(--open)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex:none}

.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;
  border-radius:var(--r-pill);font-size:12px;background:color-mix(in srgb,var(--c) 13%,transparent);
  color:var(--c);white-space:nowrap}
.badge{font-size:11px;padding:3px 8px;border-radius:var(--r-pill);
  background:var(--surface-hi);color:var(--text-dim);white-space:nowrap}

.card{background:var(--surface);border-radius:var(--r-card);padding:13px 14px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{overflow-wrap:anywhere;word-break:break-word}

svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.lg{width:22px;height:22px}

/* ── S1 ── */
.brand{font-size:26px;font-weight:600;letter-spacing:-.03em}
.tag{color:var(--text-dim);font-size:13px;margin-top:6px}

/* ── S2 status picker ── */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  padding:14px 12px;text-align:left;transition:border-color .15s ease-out,background .15s ease-out}
.pick[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.pick .ic{color:var(--c);margin-bottom:9px}
.pick b{display:block;font-size:13px;font-weight:500}

/* ── S3 list ── */
.stats{font-size:12px;color:var(--text-dim);line-height:1.5}
.mine{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.person{width:100%;text-align:left;background:var(--surface);border-radius:var(--r-card);
  padding:13px 14px;display:block;transition:background .15s ease-out}
.person:active{background:var(--surface-hi)}

/* signature: 만료가 가까울수록 바랜다 */
.fade{transition:opacity 1.2s linear}

#joinBar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:420px;
  padding:16px 16px 20px;background:linear-gradient(to top,var(--bg) 66%,transparent);z-index:10}
.empty{text-align:center;padding:52px 20px}
.empty .ic{width:30px;height:30px;color:var(--text-faint);margin-bottom:14px}

/* ── S4 sheet ── */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.62);opacity:0;pointer-events:none;
  transition:opacity .24s ease-out;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:420px;background:var(--surface);
  border-radius:20px 20px 0 0;padding:8px 18px 22px;transform:translate(-50%,102%);
  transition:transform .24s cubic-bezier(.32,.72,0,1);z-index:21;
  box-shadow:0 -8px 32px rgba(0,0,0,.5);max-height:92dvh;overflow-y:auto}
.sheet.on{transform:translate(-50%,0)}
.grip{width:34px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 16px}

/* 편애하는 화면: 여기만 손이 더 갔다 */
.why{background:var(--bg);border-radius:var(--r-card);padding:15px 16px;margin:16px 0}
.why-a,.why-b{font-size:13px;line-height:1.45}
.why-a{color:var(--looking)} .why-b{color:var(--sharing)}
.link-draw{display:block;margin:5px 0 5px 3px}
.link-draw path{stroke:var(--border-strong);stroke-width:1.5;fill:none;stroke-linecap:round}
.meter{display:flex;align-items:center;gap:7px;margin-top:13px;
  padding-top:12px;border-top:1px solid var(--border)}
.meter-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.meter-bar i{display:block;height:100%;background:var(--text-dim);border-radius:2px}
.quote{background:var(--bg);border-left:2px solid var(--text-dim);border-radius:0 8px 8px 0;
  padding:12px 14px;font-size:13px;line-height:1.6;color:var(--text)}

/* ── S5 chat ── */
.bubbles{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:14px 0}
.b{max-width:76%;padding:9px 12px;border-radius:15px;font-size:13px;line-height:1.45}
.b.me{align-self:flex-end;background:var(--text);color:var(--bg);border-bottom-right-radius:5px}
.b.you{align-self:flex-start;background:var(--surface);border-bottom-left-radius:5px}
.sysline{text-align:center;font-size:12px;color:var(--text-faint);padding:10px 24px;line-height:1.5}
.composer{display:flex;gap:9px;align-items:center;padding:11px 0 18px;border-top:1px solid var(--border)}

/* ── S6 dashboard ── */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric{background:var(--surface);border-radius:var(--r-card);padding:14px}
.metric.key{background:var(--surface-hi)}
.topic{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.topic:last-child{border:0}

/* ── dev switcher ── */
#dev{position:fixed;right:12px;bottom:12px;z-index:60}
#devbtn{width:38px;height:38px;border-radius:50%;background:var(--surface-hi);
  border:1px solid var(--border-strong);color:var(--text-dim);display:flex;
  align-items:center;justify-content:center}
#devmenu{position:absolute;right:0;bottom:46px;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--r-card);padding:7px;width:186px;display:none}
#devmenu.on{display:block}
#devmenu button{display:block;width:100%;text-align:left;padding:8px 10px;
  border-radius:8px;font-size:12px;color:var(--text-dim)}
#devmenu button:active{background:var(--surface-hi)}
#devmenu hr{border:0;border-top:1px solid var(--border);margin:5px 0}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 20l1.3-3.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v7M10 10.5V6a2 2 0 0 0-4 0v9"/><path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8v-1a2 2 0 0 1 4 0"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
  <symbol id="i-bt" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M10 14l11-11M21 3l-6.5 18-4-8-8-4L21 3z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-btoff" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5v-7"/><path d="M12 9V2l5 5-2 2"/><path d="M3 3l18 18"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></symbol>
</svg>

<div id="app">

<!-- S1 방 미리보기 : QR 찍으면 바로 여기 -->
<section class="screen on" id="s1">
  <header style="padding:18px 0 12px">
    <div class="row" style="justify-content:space-between">
      <span class="t-sm faint" style="font-weight:500;letter-spacing:-.02em">Bside</span>
      <span class="t-sm faint" id="pvWhen"></span>
    </div>
    <h1 class="t-xl" style="margin:10px 0 0" id="pvTitle"></h1>
    <p class="t-sm dim" style="margin:5px 0 0" id="pvCount"></p>
  </header>
  <div class="stats" id="pvStats" style="margin-bottom:14px"></div>
  <div id="pvList" style="display:flex;flex-direction:column;gap:8px"></div>
  <div style="height:84px"></div>
  <div id="joinBar">
    <button class="btn" onclick="openJoin()">나도 상태 달기</button>
  </div>
</section>

<!-- S2 참여 : 한 화면에서 끝낸다 -->
<section class="screen" id="s2">
  <header class="row" style="padding:16px 0 10px;gap:10px">
    <button onclick="go('s1')" aria-label="뒤로" style="width:32px;height:44px;display:flex;align-items:center">
      <svg class="ic lg"><use href="#i-back"/></svg></button>
    <h1 class="t-lg" style="margin:0">상태 달기</h1>
  </header>

  <div class="row" style="gap:8px;align-items:flex-start">
    <div class="grow">
      <label class="t-sm dim" for="nick">닉네임</label>
      <input id="nick" class="field" style="margin-top:5px" maxlength="12" placeholder="지원" autocomplete="off">
    </div>
    <div class="grow">
      <label class="t-sm dim" for="aff" id="affLabel">소속</label>
      <div id="affWrap" style="margin-top:5px"></div>
    </div>
  </div>
  <div id="affOtherWrap" style="margin-top:8px"></div>

  <p class="t-sm dim" style="margin:18px 0 7px">지금 무엇을 찾고 계세요?</p>
  <div class="picks" id="picks"></div>

  <div style="margin-top:14px">
    <textarea id="note" class="field" maxlength="140"
      placeholder="배포·CI 경험 있으신 분 찾아요" oninput="noteTyped()"></textarea>
    <div class="row" style="justify-content:space-between;margin-top:4px">
      <span class="err" id="e2" style="margin:0"></span>
      <span class="t-sm faint" id="count">0 / 140</span>
    </div>
  </div>

  <div style="margin-top:auto;padding-bottom:20px">
    <button class="btn" onclick="saveStatus()">올리기</button>
  </div>
</section>

<!-- ══ S3 방 ══ -->
<section class="screen" id="s3">
  <header style="padding:20px 0 14px">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h1 class="t-lg" style="margin:0" id="roomTitle">코쓱톤 네트워킹</h1>
      <span class="t-sm dim" id="headcount">47명</span>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div style="margin-top:14px" id="mineWrap"></div>
  <div class="row" style="justify-content:space-between;margin:20px 0 9px">
    <span class="t-sm dim" id="listLabel">같은 공간</span>
    <span class="t-sm faint" id="matchState"></span>
  </div>
  <div id="people" style="display:flex;flex-direction:column;gap:8px;padding-bottom:26px"></div>
</section>

<!-- ══ S5 채팅 ══ -->
<section class="screen" id="s5">
  <header class="row" style="padding:18px 0 12px;border-bottom:1px solid var(--border);gap:10px">
    <button onclick="go('s3')" aria-label="뒤로" style="width:32px;height:44px;display:flex;align-items:center">
      <svg class="ic lg"><use href="#i-back"/></svg></button>
    <div class="grow">
      <div class="t-lg" id="chatName">민서</div>
      <div class="t-sm faint" id="chatSub">순천향대</div>
    </div>
    <span class="badge" id="btBadge">
      <svg class="ic" style="width:12px;height:12px;vertical-align:-2px"><use href="#i-bt"/></svg> 직접 연결</span>
  </header>
  <div id="btOff" style="display:none">
    <div class="empty">
      <svg class="ic"><use href="#i-btoff"/></svg>
      <p class="t-md" style="margin:0 0 6px">블루투스가 꺼져 있어요</p>
      <p class="t-sm dim" style="margin:0 0 18px;line-height:1.6">
        대화는 기기끼리 직접 주고받습니다.</p>
      <button class="btn btn-ghost" style="width:auto;padding:0 20px;height:44px;margin:0 auto"
        onclick="btOn()">블루투스 켜기</button>
      <p class="t-sm faint" style="margin:18px 0 0;line-height:1.6">
        꺼져 있어도 방 목록은 그대로 보입니다.</p>
    </div>
  </div>
  <div id="chatBody" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <p class="sysline">방을 나가면 사라집니다.</p>
    <div class="bubbles" id="bubbles"></div>
    <div class="composer">
      <input id="msg" class="field" style="height:44px" placeholder="메시지" autocomplete="off"
        onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()" aria-label="보내기"
        style="width:44px;height:44px;display:flex;align-items:center;justify-content:center">
        <svg class="ic lg"><use href="#i-send"/></svg></button>
    </div>
  </div>
</section>

<!-- ══ S6 대시보드 ══ -->
<section class="screen" id="s6">
  <header style="padding:20px 0 16px">
    <div class="row" style="justify-content:space-between">
      <div>
        <h1 class="t-lg" style="margin:0" id="dashTitle">코쓱톤 네트워킹</h1>
        <p class="t-sm faint" style="margin:3px 0 0">운영진 화면 · 실시간</p>
      </div>
      <button onclick="go('s3')" class="t-sm dim" style="height:44px">참가자 화면</button>
    </div>
  </header>
  <div class="metrics">
    <div class="metric"><div class="t-sm dim">입장</div>
      <div class="t-num" style="margin-top:3px">47<span class="t-sm faint"> / 90</span></div></div>
    <div class="metric"><div class="t-sm dim">상태 설정</div>
      <div class="t-num" style="margin-top:3px">41</div></div>
    <div class="metric"><div class="t-sm dim">접점 발견</div>
      <div class="t-num" style="margin-top:3px">37</div></div>
    <div class="metric key"><div class="t-sm dim">대화 시작</div>
      <div class="t-num" style="margin-top:3px">24</div></div>
  </div>
  <p class="t-sm dim" style="margin:22px 0 2px">많이 나온 주제</p>
  <div>
    <div class="topic"><span class="t-md">배포·CI</span><span class="t-sm dim">9건</span></div>
    <div class="topic"><span class="t-md">서비스 기획</span><span class="t-sm dim">6건</span></div>
    <div class="topic"><span class="t-md">디자인 시스템</span><span class="t-sm dim">4건</span></div>
    <div class="topic"><span class="t-md">취업·이직</span><span class="t-sm dim">3건</span></div>
  </div>
  <div class="row" style="gap:9px;margin-top:auto;padding:20px 0 24px">
    <button class="btn btn-ghost" style="height:46px"><svg class="ic"><use href="#i-qr"/></svg> QR 띄우기</button>
    <button class="btn btn-ghost" style="height:46px"><svg class="ic"><use href="#i-dl"/></svg> 리포트</button>
  </div>
</section>

<!-- ══ S4 접점 시트 — 편애하는 화면 ══ -->
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="접점"><div id="sheetIn"></div></div>

</div>

<div id="dev">
  <button id="devbtn" onclick="document.getElementById('devmenu').classList.toggle('on')" aria-label="데모 상태 전환">
    <svg class="ic"><use href="#i-sliders"/></svg></button>
  <div id="devmenu">
    <button onclick="dm('flow')">처음부터 (미리보기)</button>
    <button onclick="dm('room2')">다른 행사로 (밋업)</button>
    <button onclick="dm('room')">방 · 기본</button>
    <button onclick="dm('match')">접점 카드 열기</button>
    <button onclick="dm('none')">접점 없음</button>
    <hr>
    <button onclick="dm('empty')">방이 텅 빔</button>
    <button onclick="dm('loading')">매칭 중</button>
    <button onclick="dm('btoff')">블루투스 꺼짐</button>
    <button onclick="dm('longtext')">긴 텍스트</button>
    <hr>
    <button onclick="dm('dash')">운영진 대시보드</button>
    <button onclick="dm('expire')">만료 빨리감기</button>
  </div>
</div>

<script>
const TTL = 300;                   // 상태 유효시간(초)

/* 행사마다 다른 것은 전부 여기 있다. 코드에 박지 않는다.
   주최자가 방을 만들 때 정하고, 참가자 화면은 이 설정을 따라간다. */
const ROOMS = {
  KOSS26: {
    title:'코쓱톤 네트워킹', when:'국민대 미래관 4층 · 오늘 18:00까지',
    aff:{ label:'소속', options:['국민대','숭실대','순천향대'], placeholder:'직접 입력' },
    set:'HACKATHON'
  },
  FEMEETUP: {
    title:'서울 프론트엔드 밋업', when:'성수 코워킹 · 오늘 21:00까지',
    aff:{ label:'회사', options:null, placeholder:'예: 토스, 프리랜서, 취준' },
    set:'MEETUP'
  }
};
let ROOM = ROOMS.KOSS26;

const SETS = {
  HACKATHON:['LOOKING_FOR','CAN_SHARE','FIRST_TIME','OPEN'],
  MEETUP:   ['LOOKING_FOR','CAN_SHARE','FIRST_TIME','OPEN']
};

const STATUSES = [
  {k:'LOOKING_FOR', label:'이런 분 찾아요',        icon:'i-search', ph:'배포·CI 경험 있으신 분 찾아요',            q:'어떤 분을 찾으세요?'},
  {k:'CAN_SHARE',   label:'이런 얘기 할 수 있어요', icon:'i-msg',    ph:'작년에 도커로 CI 파이프라인 구축해봤어요',  q:'어떤 얘기를 해주실 수 있나요?'},
  {k:'FIRST_TIME',  label:'처음 왔어요',           icon:'i-hand',   ph:'혼자 왔어요. 기획하다가 백엔드가 궁금해졌어요', q:'어떤 얘기든 좋아요'},
  {k:'OPEN',        label:'대화 가능',             icon:'i-circle', ph:'뭐든 편하게 말 걸어주세요',                q:'한마디 남겨주세요'},
];
const SL = Object.fromEntries(STATUSES.map(s=>[s.k,s.label]));
const SI = Object.fromEntries(STATUSES.map(s=>[s.k,s.icon]));

// 구체적인 한 줄. 뭉뚱그린 말은 가짜처럼 보인다.
const SEED = [
  {id:'minseo', name:'민서',  school:'순천향대', st:'CAN_SHARE',
   note:'작년에 도커로 CI 파이프라인 구축해봤어요', near:true,  age:40},
  {id:'yerin',  name:'예린',  school:'숭실대',   st:'CAN_SHARE',
   note:'React 상태관리로 삽질 오래 했어요. 물어보셔도 돼요', near:true, age:95},
  {id:'taehyun',name:'태현',  school:'숭실대',   st:'FIRST_TIME',
   note:'혼자 왔어요. 기획하다가 백엔드가 궁금해졌어요', near:false, age:150},
  {id:'sua',    name:'수아',  school:'국민대',   st:'LOOKING_FOR',
   note:'디자인 시스템 토큰 잡아보신 분 계실까요', near:false, age:205},
  {id:'junho',  name:'준호',  school:'순천향대', st:'OPEN',
   note:'커피 들고 서 있어요. 아무나 오세요', near:false, age:262},
];

let S = {me:null, st:null, people:[], mode:'room', speed:1, bt:true, t0:Date.now()};

/* ── nav ── */
function go(id){
  document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on', e.id===id));
  document.getElementById('app').scrollTop = 0;
  window.scrollTo(0,0);
}

/* 미리보기 */
let PREVIEW = [];
const SHORT = {LOOKING_FOR:'찾는 중', CAN_SHARE:'나눌 수 있음', FIRST_TIME:'처음', OPEN:'대화 가능'};
function tally(list){
  const c = {}; list.forEach(p => c[p.st] = (c[p.st]||0) + 1);
  return STATUSES.filter(s=>c[s.k]).map(s=>`${SHORT[s.k]} ${c[s.k]}`).join('  ·  ');
}

function renderPreview(){
  document.getElementById('pvTitle').textContent = ROOM.title;
  document.getElementById('pvWhen').textContent  = ROOM.when.split(' \u00b7 ').pop();
  document.getElementById('pvCount').textContent =
    PREVIEW.length ? `지금 ${PREVIEW.length + 42}명이 상태를 올려뒀어요` : '아직 아무도 없어요';
  document.getElementById('pvStats').textContent = tally(PREVIEW);
  document.getElementById('pvList').innerHTML = PREVIEW.slice(0,4).map(p=>`
    <div class="person">
      <div class="row" style="gap:7px">
        <span class="t-lg grow trunc">${esc(p.name)}</span>
        ${p.near ? '<span class="badge">닿는 거리</span>' : ''}
      </div>
      <div class="t-sm faint" style="margin:1px 0 6px">${esc(p.school)} \u00b7 ${SL[p.st]}</div>
      <div class="t-md wrap">${esc(p.note)}</div>
    </div>`).join('') || `<div class="empty">
      <svg class="ic"><use href="#i-inbox"/></svg>
      <p class="t-md" style="margin:0">첫 번째로 상태를 올려보세요</p></div>`;
}

/* 참여 */
function openJoin(){
  renderAff(); renderPicks(); go('s2');
  setTimeout(()=>document.getElementById('nick').focus(), 80);
}
function renderAff(){
  document.getElementById('affLabel').textContent = ROOM.aff.label;
  document.getElementById('affOtherWrap').innerHTML = '';
  document.getElementById('affWrap').innerHTML = ROOM.aff.options
    ? `<select id="aff" class="field" onchange="affPick()">${
        ROOM.aff.options.map(x=>`<option>${esc(x)}</option>`).join('')
      }<option value="__other">직접 입력</option></select>`
    : `<input id="aff" class="field" maxlength="20" placeholder="${esc(ROOM.aff.placeholder)}" autocomplete="off">`;
}
function affPick(){
  const sel = document.getElementById('aff'), o = document.getElementById('affOtherWrap');
  if(sel.value === '__other'){
    o.innerHTML = `<input id="affOther" class="field" maxlength="20" placeholder="${esc(ROOM.aff.placeholder)}" autocomplete="off">`;
    document.getElementById('affOther').focus();
  } else o.innerHTML = '';
}
function affValue(){
  const el = document.getElementById('aff');
  if(el.tagName === 'INPUT') return el.value.trim();
  if(el.value === '__other') return (document.getElementById('affOther')?.value || '').trim();
  return el.value;
}

/* 상태 고르기 */
function renderPicks(){
  document.getElementById('picks').innerHTML = STATUSES.map(s=>`
    <button class="pick s-${s.k}" aria-pressed="${S.st===s.k}" onclick="pick('${s.k}')">
      <svg class="ic"><use href="#${s.icon}"/></svg><b>${s.label}</b>
    </button>`).join('');
}
function pick(k){
  S.st = k; renderPicks();
  document.getElementById('note').placeholder = STATUSES.find(x=>x.k===k).ph;
  document.getElementById('e2').textContent = '';
}
function noteTyped(){
  const v = document.getElementById('note').value;
  document.getElementById('count').textContent = `${v.length} / 140`;
  if(v.trim()) document.getElementById('e2').textContent = '';
}
function saveStatus(){
  const e = document.getElementById('e2');
  const n = document.getElementById('nick').value.trim();
  if(!n){ e.textContent='닉네임을 입력해 주세요'; document.getElementById('nick').focus(); return; }
  const a = affValue();
  if(!a){ e.textContent=ROOM.aff.label+'을 입력해 주세요'; return; }
  if(!S.st){ e.textContent='상태를 하나 골라주세요'; return; }
  const v = document.getElementById('note').value.trim();
  if(!v){ e.textContent='한 줄만 적어주세요. 이게 있어야 이어드릴 수 있어요'; return; }
  e.textContent='';
  S.me = {id:'me', name:n, school:a, st:S.st, note:v, age:0};
  S.t0 = Date.now();
  S.people = S.mode==='empty' ? [] : PREVIEW.map(p=>({...p}));
  go('s3'); renderRoom();
  if(S.mode!=='empty' && S.mode!=='none') runMatch();
}

/* ── 만료: 남은 시간에 따라 바랜다 ── */
function lifeOf(p){
  const age = p.age + (Date.now()-S.t0)/1000*S.speed;
  return Math.max(0, 1 - age/TTL);
}
function fadeOf(life){ return life>.45 ? 1 : .34 + (life/.45)*.66; }

/* ── S3 ── */
function renderRoom(){
  document.getElementById('roomTitle').textContent = ROOM.title;
  document.getElementById('dashTitle').textContent = ROOM.title;
  const ppl = S.people.filter(p=>lifeOf(p)>0);
  document.getElementById('headcount').textContent = (ppl.length+1)+'명';

  document.getElementById('stats').textContent = tally(ppl) || '아직 아무도 상태를 달지 않았어요';

  const life = lifeOf(S.me), left = Math.ceil(life*TTL/60);
  document.getElementById('mineWrap').innerHTML = `
    <button class="card mine s-${S.me.st}" style="width:100%;text-align:left" onclick="editMine()">
      <div class="row" style="justify-content:space-between;margin-bottom:5px">
        <span class="t-sm" style="color:var(--c)">내 상태 · ${SL[S.me.st]}</span>
        <span class="t-sm faint">${life>0 ? left+'분 뒤 사라짐' : '사라짐'}</span>
      </div>
      <div class="t-md wrap" style="opacity:${fadeOf(life).toFixed(2)}">${esc(S.me.note)}</div>
    </button>`;

  const box = document.getElementById('people');
  if(!ppl.length){
    document.getElementById('listLabel').textContent = '';
    box.innerHTML = `<div class="empty">
      <svg class="ic"><use href="#i-inbox"/></svg>
      <p class="t-md" style="margin:0 0 6px">아직 이 방에 혼자 계세요</p>
      <p class="t-sm dim" style="margin:0 0 20px;line-height:1.6">
        누가 들어오면 알려드릴게요.</p>
      <button class="btn btn-ghost" style="width:auto;padding:0 18px;height:44px;margin:0 auto">
        <svg class="ic"><use href="#i-qr"/></svg> QR 공유하기</button>
    </div>`;
    return;
  }
  document.getElementById('listLabel').textContent = '같은 공간';
  box.innerHTML = ppl.map(p=>{
    const l=lifeOf(p), o=fadeOf(l).toFixed(2);
    return `<button class="person fade" style="opacity:${o}" onclick="openSheet('${p.id}')">
      <div class="row" style="gap:7px">
        <span class="t-lg grow trunc">${esc(p.name)}</span>
        ${p.near?'<span class="badge">닿는 거리</span>':''}
      </div>
      <div class="t-sm faint" style="margin:1px 0 6px">${esc(p.school)} · ${SL[p.st]}</div>
      <div class="t-md wrap">${esc(p.note)}</div>
    </button>`;
  }).join('');
}
function editMine(){
  renderAff(); S.st = S.me.st; renderPicks(); go('s2');
  document.getElementById('nick').value = S.me.name;
  document.getElementById('note').value = S.me.note; noteTyped();
}

/* ── 매칭: 스피너 대신 구체적인 문구 ── */
let matchTimer=null;
function runMatch(){
  const el = document.getElementById('matchState');
  const n = S.people.length+1;
  el.textContent = `${n}명 중에서 찾는 중`;
  clearTimeout(matchTimer);
  matchTimer = setTimeout(()=>{
    el.textContent='';
    if(S.mode==='none'){ openSheet(null); } else { openSheet('minseo'); }
  }, 1900);
}

/* ── S4 시트 ── */
function openSheet(pid){
  const p = S.people.find(x=>x.id===pid);
  const box = document.getElementById('sheetIn');
  if(!p){
    box.innerHTML = `<div class="grip"></div>
      <div style="padding:8px 2px 4px">
        <h2 class="t-lg" style="margin:0 0 8px">아직 이어드릴 분이 없어요</h2>
        <p class="t-md dim" style="margin:0;line-height:1.65">
          지금 ${S.people.length+1}명이 계시지만, 찾으시는
          <b style="color:var(--text);font-weight:400">배포·CI 경험</b>을 올리신 분이 아직 없네요.</p>
        <p class="t-sm faint" style="margin:14px 0 20px;line-height:1.6">
          누가 들어오면 알려드릴게요.</p>
        <button class="btn btn-ghost" onclick="closeSheet()">알겠어요</button>
      </div>`;
  } else {
    box.innerHTML = `<div class="grip"></div>
      <div style="padding:2px 2px 4px">
        <div class="row" style="gap:7px;margin-bottom:9px">
          <span class="chip s-${p.st}">${SL[p.st]}</span>
          ${p.near?'<span class="badge">닿는 거리</span>':''}
        </div>
        <h2 class="t-xl" style="margin:0 0 7px">${esc(p.name)}님이 계세요</h2>
        <p class="t-md dim" style="margin:0;line-height:1.65">
          찾고 계신 배포·CI 경험, ${esc(p.name)}님이 작년에 구축해보셨어요.</p>

        <div class="why">
          <div class="t-sm faint" style="margin-bottom:9px">왜 이어드렸나</div>
          <div class="why-a">배포·CI 경험을 찾는 중</div>
          <svg class="link-draw" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
            <path d="M5 2 C 5.6 8, 4.3 13, 6.2 18 M6.2 18 L3.4 14.6 M6.2 18 L9.4 15.2"/>
          </svg>
          <div class="why-b">작년에 CI 파이프라인 구축</div>
          <div class="meter">
            <span class="t-sm faint">겹치는 단어 0개</span>
            <span class="meter-bar"><i style="width:85%"></i></span>
            <span class="t-sm dim">0.85</span>
          </div>
        </div>

        <div class="t-sm faint" style="margin-bottom:7px">이렇게 말 걸어보세요</div>
        <p class="quote" style="margin:0">
          혹시 CI 구축해보셨다고 들었어요. 저 지금 배포 권한에서 막혀 있는데요.</p>

        <div class="row" style="gap:9px;margin-top:20px">
          <button class="btn" onclick="toChat('${p.id}')">말 걸기</button>
          <button class="btn btn-ghost" onclick="closeSheet()">괜찮아요</button>
        </div>
        <p class="t-sm faint" style="text-align:center;margin:13px 0 0;line-height:1.55">
          ${esc(p.name)}님께 전해지는 건 이름과 이 한 줄뿐입니다.</p>
      </div>`;
  }
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}

/* ── S5 ── */
const CHAT0 = [
  {me:true,  t:'혹시 CI 구축해보셨다고 들었어요. 저 지금 배포 권한에서 막혀 있는데요'},
  {me:false, t:'아 네 작년에요. 어떤 에러예요?'},
  {me:true,  t:'Actions에서 빌드는 되는데 배포 단계에서 권한 오류가 나요'},
];
let chat = [];
function toChat(pid){
  const p = S.people.find(x=>x.id===pid);
  closeSheet();
  document.getElementById('chatName').textContent = p.name;
  document.getElementById('chatSub').textContent = p.school;
  chat = CHAT0.map(c=>({...c}));
  S.bt = S.mode!=='btoff';
  paintBt(); renderChat(); go('s5');
}
function paintBt(){
  document.getElementById('btOff').style.display = S.bt?'none':'block';
  document.getElementById('chatBody').style.display = S.bt?'flex':'none';
  document.getElementById('btBadge').style.display = S.bt?'':'none';
}
function btOn(){ S.bt=true; S.mode='room'; paintBt(); }
function renderChat(){
  document.getElementById('bubbles').innerHTML =
    chat.map(c=>`<div class="b ${c.me?'me':'you'}">${esc(c.t)}</div>`).join('');
  const b=document.getElementById('bubbles'); b.scrollTop=b.scrollHeight;
}
function send(){
  const i=document.getElementById('msg'), v=i.value.trim();
  if(!v) return;
  chat.push({me:true,t:v}); i.value=''; renderChat();
  setTimeout(()=>{ chat.push({me:false,t:'창가 쪽에 있어요. 손 들게요'}); renderChat(); }, 900);
}

/* ── 데모 전환 ── */
function dm(m){
  document.getElementById('devmenu').classList.remove('on');
  closeSheet(); clearTimeout(matchTimer); S.speed=1; S.bt=true;
  if(m==='room2'){ ROOM = ROOMS.FEMEETUP; m='flow'; }
  else if(m==='flow'){ ROOM = ROOMS.KOSS26; }
  if(m==='flow'){ S={me:null,st:null,people:[],mode:'room',speed:1,bt:true,t0:Date.now()};
    PREVIEW = SEED.map(p=>({...p})); renderPreview();
    document.getElementById('nick').value=''; document.getElementById('note').value='';
    document.getElementById('count').textContent='0 / 140'; go('s1'); return; }
  // longtext 모드가 남긴 값이 다음 모드로 새지 않게 매번 초기화한다
  S.me={id:'me',name:'지원',school:ROOM.aff.options?ROOM.aff.options[0]:'토스',st:'LOOKING_FOR',
    note:'배포·CI 경험 있으신 분 찾아요',age:0};
  S.st = S.me.st; PREVIEW = SEED.map(p=>({...p}));
  S.t0 = Date.now(); S.mode = m;
  S.people = SEED.map(p=>({...p}));

  if(m==='empty')   S.people = [];
  if(m==='longtext'){
    S.me.name='김지원국민대소프트웨어학부';
    S.me.note='배포랑 CI 쪽 경험 있으신 분 찾고 있어요. GitHub Actions에서 빌드까지는 통과하는데 배포 단계에서 권한 오류가 계속 나서 어제부터 붙잡고 있는데 도저히 안 풀리네요. 혹시 비슷한 거 겪어보신 분 계실까요';
    S.people[0].note='작년에 개인 프로젝트에서 도커로 CI 파이프라인 구축해봤고 회사 인턴 때도 배포 자동화 만들어봤어요. Actions랑 Jenkins 둘 다 써봤습니다';
  }
  if(m==='expire'){ S.speed=26; }
  if(m==='btoff'){ S.bt=false; }

  renderRoom();
  if(m==='dash'){ go('s6'); return; }
  go('s3');
  if(m==='match')   openSheet('minseo');
  if(m==='none')    { S.people = S.people.filter(p=>p.st!=='CAN_SHARE'); renderRoom(); openSheet(null); }
  if(m==='loading') runMatch();
  if(m==='btoff')   toChat('minseo');
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

PREVIEW = SEED.map(p=>({...p}));
renderPreview();
setInterval(()=>{ if(S.me && document.getElementById('s3').classList.contains('on')) renderRoom(); }, 1000);
</script>
</body>
</html>
