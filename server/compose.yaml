services:
  api:
    build: .
    # Survive a host reboot and a Docker restart. Without this the stack comes back
    # only if someone runs compose again, which a deployed API cannot rely on.
    # `unless-stopped` rather than `always`: an explicit `docker compose stop` stays
    # stopped, so maintenance does not fight the restart policy.
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173","https://localhost"]}
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8.10.1
    restart: unless-stopped
    ports:
      # Published for local tests, which talk to 127.0.0.1:6379. The API itself
      # reaches Redis over the compose network, not through this port. REDIS_PORT
      # moves it if a host already has something on 6379.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  redis-data:
