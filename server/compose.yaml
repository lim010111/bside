services:
  api:
    build: .
    # Survive a host reboot and a Docker restart. Without this the stack comes back
    # only if someone runs compose again, which a deployed API cannot rely on.
    # `unless-stopped` rather than `always`: an explicit `docker compose stop` stays
    # stopped, so maintenance does not fight the restart policy.
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      CREDENTIAL_REPLAY_SECRET: ${CREDENTIAL_REPLAY_SECRET:?CREDENTIAL_REPLAY_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173","https://localhost"]}
      # .dockerignore keeps server/.env out of the image, so the AI settings have
      # to arrive here. Compose reads them from server/.env on the host. Leaving
      # them empty is supported: the API then reports 'unavailable' recommendations
      # rather than refusing to start.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      # The Firebase service account, mounted rather than baked in: it is a
      # private key and .dockerignore keeps it out of the image. Unset means
      # the server runs and never pushes.
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
    volumes:
      # Read-only, and outside server/ on the host so a deploy cannot delete it.
      - ${FCM_CREDENTIALS_HOST_FILE:-/dev/null}:/run/secrets/fcm.json:ro
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8.10.1
    restart: unless-stopped
    ports:
      # Published for local tests, which talk to 127.0.0.1:6379. The API itself
      # reaches Redis over the compose network, not through this port. REDIS_PORT
      # moves it if a host already has something on 6379.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  redis-data:
