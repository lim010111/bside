[project]
name = "bside-server"
version = "0.1.0"
description = "Bside FastAPI server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]",
 "pydantic-settings",
 "redis>=8.1.0",
 "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest", "httpx", "pytest-asyncio>=0.24"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
